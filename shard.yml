name: clpaste
version: 0.2.0

authors:
  - Davor Ocelic <docelic@spinlocksolutions.com>

description: |
  Encrypted paste service with OIDC-gated creation, fine-grained retrieval
  controls (PIN, password, view/time limits, IP and email allowlists),
  audit logging, admin overview, and a gcloud-style CLI. Single binary.

crystal: ">= 1.10.0"

license: AGPL-3.0

dependencies:
  superconf:
    github: crystallabs/superconf.cr
    branch: master
  crinja:
    github: straight-shoota/crinja
    version: ~> 0.9.0
  db:
    github: crystal-lang/crystal-db
    version: ~> 0.14.0
  sqlite3:
    github: crystal-lang/crystal-sqlite3
    version: ~> 0.23.0
  pg:
    github: will/crystal-pg
    version: ~> 0.30.0

targets:
  clpaste:
    main: src/clpaste.cr

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    branch: master
