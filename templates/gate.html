{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card"><div class="card-body">
    <h1 class="h5 mb-3">Paste <span class="mono">{{ id_fmt }}</span></h1>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    {% if need_login %}
      <p>This paste requires you to sign in.</p>
      <a class="btn btn-primary" href="/login?next={{ next | urlencode }}">Sign in</a>
    {% else %}
    <form method="post" action="{{ action }}">
      {% if need_pin %}
      <div class="mb-3">
        <label class="form-label">PIN</label>
        <input class="form-control mono" name="pin" inputmode="numeric" autocomplete="one-time-code" autofocus required>
      </div>
      {% endif %}
      {% if need_password %}
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" required>
      </div>
      {% endif %}
      <button class="btn btn-primary" type="submit">Open paste</button>
    </form>
    {% endif %}
  </div></div>
</div></div>
{% endblock %}
