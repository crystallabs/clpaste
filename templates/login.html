{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card"><div class="card-body text-center">
    <h1 class="h4 mb-3">{{ site_name }}</h1>
    <form class="d-flex justify-content-center" action="/view" method="get">
      <input class="form-control mono me-2 w-auto" name="id" placeholder="Paste ID" size="14" aria-label="Paste ID" autocomplete="off" inputmode="numeric" required>
      <button class="btn btn-primary" type="submit">View</button>
    </form>
    <div class="mt-4">
      {% if oidc %}
      <a class="btn btn-primary" href="/login">Sign in</a>
      {% endif %}
      {% if basic %}
      <a class="btn btn-outline-secondary" href="/login?basic=1">Admin sign-in</a>
      {% endif %}
      {% if not oidc and not basic %}
      <div class="alert alert-warning">No sign-in method is configured (set CLPASTE_OIDC_* or CLPASTE_ADMIN_PASSWORD).</div>
      {% endif %}
    </div>
  </div></div>
</div></div>
{% endblock %}
